<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>CSS Exercise 02 - Form</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="form">
    <main>
      <h1>Roth IRA Calculator</h1>
      <form action="/calculate" class="ira-form">
        <div class="form-element">
          <label class="form-label" for="balance">Balance ($)</label>
          <input class="form-input" type="text" id="balance" name="balance" />
        </div>
        <div class="form-element">
          <label class="form-label" for="contribution"
            >Annual contribution ($)</label
          >
          <input
            class="form-input"
            type="text"
            name="contribution"
            id="contribution"
          />
        </div>
        <fieldset>
          <legend class="form-legend">Maximize contribution?</legend>
          <div class="form-radios">
            <input type="radio" name="maximize" id="yes" value="yes" />
            <label class="form-label-radio" for="yes">Yes</label>
            <input type="radio" name="maximize" id="no" value="no" />
            <label class="form-label-radio" for="no">No</label>
          </div>
        </fieldset>
        <div class="form-element">
          <label class="form-label" for="return-rate"
            >Expected rate of return (5)</label
          >
          <input
            class="form-input"
            type="number"
            name="return-rate"
            id="return-rate"
          />
        </div>
        <div class="form-element">
          <label class="form-label" for="age">Current age</label>
          <input class="form-input" type="number" name="current-age" id="age" />
        </div>
        <div class="form-element">
          <label class="form-label" for="retirement">Retirement age</label>
          <input
            class="form-input"
            type="number"
            name="retirement-age"
            id="retirement"
          />
        </div>
        <div class="form-element">
          <label class="form-label" for="tax">Marginal tax rate (%)</label>
          <input class="form-input" type="number" name="tax-rate" id="tax" />
        </div>
        <div class="form-element">
          <input class="btn btn-submit" type="submit" value="Calculate" />
          <input class="btn btn-reset" type="reset" value="Reset" />
        </div>
      </form>
      <p>
        This exercise is a simplified version of the Roth IRA Calculator at
        <a href="https://www.calculator.net">Calculator.net</a>
      </p>
    </main>
  </body>
</html>
